# NexNOC — Apache front door (Debian/Ubuntu)
# setup.sh installs this as /etc/apache2/sites-available/nexnoc.conf
# and substitutes @@SERVER_NAME@@ / @@WEB_PORT@@.
#
# Python dashboard stays on 127.0.0.1 (nexnoc-web.service).
# Apache is the only public listener.

<VirtualHost *:80>
    ServerName @@SERVER_NAME@@

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:@@WEB_PORT@@/
    ProxyPassReverse / http://127.0.0.1:@@WEB_PORT@@/

    ErrorLog  ${APACHE_LOG_DIR}/nexnoc-error.log
    CustomLog ${APACHE_LOG_DIR}/nexnoc-access.log combined
</VirtualHost>

