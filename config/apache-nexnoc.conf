# NexNOC — Apache front door (Debian/Ubuntu)
# setup.sh installs this as /etc/apache2/sites-available/nexnoc.conf
# and substitutes @@SERVER_NAME@@ / @@WEB_PORT@@ / @@PREFIX@@ / @@DATA@@.
#
# Apache serves the site (web/) plus local tiles and pin uploads.
# Python (nexnoc-web) is the JSON API on 127.0.0.1 only.

<VirtualHost *:80>
    ServerName @@SERVER_NAME@@

    DocumentRoot @@PREFIX@@/web
    <Directory @@PREFIX@@/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex index.html

    RewriteEngine On
    RewriteRule ^/kiosk/?$ /dashboard.html [L]
    RewriteRule ^/dashboard/?$ /dashboard.html [L]
    RewriteRule ^/login\.html$ / [R=302,L]
    RewriteRule ^/login/?$ / [R=302,L]

    Alias /tiles @@DATA@@/tiles
    <Directory @@DATA@@/tiles>
        Options -Indexes
        Require all granted
    </Directory>

    Alias /uploads/pins @@DATA@@/uploads/pins
    <Directory @@DATA@@/uploads/pins>
        Options -Indexes
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        /api/ http://127.0.0.1:@@WEB_PORT@@/api/
    ProxyPassReverse /api/ http://127.0.0.1:@@WEB_PORT@@/api/

    ErrorLog  ${APACHE_LOG_DIR}/nexnoc-error.log
    CustomLog ${APACHE_LOG_DIR}/nexnoc-access.log combined
</VirtualHost>

