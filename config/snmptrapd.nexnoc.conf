# Optional SNMPv3 trap path via net-snmp snmptrapd.
#
# nexnoc-trapd already binds UDP 162 for SNMPv1/v2c. Do not run snmptrapd
# on the same port at the same time. For SNMPv3 traps:
#   1. systemctl disable --now nexnoc-trapd
#   2. install this file (or include it) as snmptrapd.conf
#   3. add createUser / authUser lines for your USM users
#   4. systemctl enable --now snmptrapd
#
# Community strings and USM secrets must never be committed to git.

disableAuthorization yes
traphandle default /opt/nexnoc/scripts/nexnoc-traphandle
