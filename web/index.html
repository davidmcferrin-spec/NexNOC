<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — NexNOC</title>
  <script>
    try {
      var theme = localStorage.getItem("nexnoc.theme");
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/login.css">
</head>
<body class="auth-page">
  <button type="button" class="btn theme-toggle" id="theme-toggle" title="Switch to light mode" aria-label="Switch to light mode" aria-pressed="false">
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>
    </svg>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            d="M21 14.5A9 9 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
    </svg>
  </button>
  <div class="auth-card">
    <div class="auth-logo">NexNOC</div>
    <h1 id="auth-title">Sign in</h1>
    <p class="auth-subtitle" id="auth-subtitle">NOC dashboard</p>
    <div class="auth-error" id="auth-error" hidden></div>
    <form id="login-form" class="auth-form">
      <label>Username
        <input name="username" type="text" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn auth-submit">Sign in</button>
    </form>
    <form id="pw-form" class="auth-form" hidden>
      <label>Current password
        <input name="current_password" type="password" autocomplete="current-password" required>
      </label>
      <label>New password
        <input name="new_password" type="password" autocomplete="new-password" required minlength="6">
      </label>
      <button type="submit" class="btn auth-submit">Save password</button>
    </form>
    <p class="auth-kiosk"><a href="/kiosk">Open kiosk board</a></p>
  </div>
  <script>
    (function initTheme() {
      const key = "nexnoc.theme";
      const btn = document.getElementById("theme-toggle");
      function current() {
        return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      }
      function apply(theme) {
        const next = theme === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem(key, next); } catch (e) {}
        if (!btn) return;
        const label = next === "light" ? "Switch to dark mode" : "Switch to light mode";
        btn.title = label;
        btn.setAttribute("aria-label", label);
        btn.setAttribute("aria-pressed", next === "light" ? "true" : "false");
      }
      let saved = "dark";
      try {
        const raw = localStorage.getItem(key);
        if (raw === "light" || raw === "dark") saved = raw;
      } catch (e) {}
      apply(saved);
      btn?.addEventListener("click", () => apply(current() === "light" ? "dark" : "light"));
    })();

    const LOGIN_PATHS = new Set(["/", "/index.html", "/login", "/login.html"]);

    function safeNext(raw) {
      const value = (raw || "/dashboard").trim() || "/dashboard";
      if (!value.startsWith("/") || value.startsWith("//")) return "/dashboard";
      const path = value.split(/[?#]/)[0];
      if (LOGIN_PATHS.has(path)) return "/dashboard" + value.slice(path.length);
      return value;
    }

    const params = new URLSearchParams(location.search);
    const next = safeNext(params.get("next"));
    const err = document.getElementById("auth-error");
    const loginForm = document.getElementById("login-form");
    const pwForm = document.getElementById("pw-form");

    function showError(message) {
      err.hidden = !message;
      err.textContent = message || "";
    }

    function showPasswordForm() {
      document.title = "Change password — NexNOC";
      document.getElementById("auth-title").textContent = "Change password";
      document.getElementById("auth-subtitle").textContent =
        "Change the seeded password before opening the board.";
      loginForm.hidden = true;
      pwForm.hidden = false;
      pwForm.current_password.focus();
    }

    function finishLogin(user) {
      if (user && user.must_change_password) {
        showPasswordForm();
        return;
      }
      location.href = next;
    }

    if (params.get("reason") === "timeout") {
      showError("Session expired after inactivity.");
    } else if (params.get("reason") === "password") {
      showError("Change your password before opening the board.");
    }

    fetch("/api/auth/me").then(async (res) => {
      if (!res.ok) return;
      const payload = await res.json().catch(() => ({}));
      finishLogin(payload.user);
    }).catch(() => { /* stay on the form */ });

    loginForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const data = new FormData(ev.target);
      showError("");
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: data.get("username"),
            password: data.get("password"),
          }),
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
        finishLogin(payload.user);
      } catch (exc) {
        showError(exc.message);
      }
    });

    pwForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const data = new FormData(ev.target);
      showError("");
      try {
        const res = await fetch("/api/auth/password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            current_password: data.get("current_password"),
            new_password: data.get("new_password"),
          }),
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
        location.href = next;
      } catch (exc) {
        showError(exc.message);
      }
    });
  </script>
</body>
</html>
